.field{position:relative;margin-top:12px}
.field input{width:100%;height:60px;border:1px solid var(--edge2);border-radius:20px;background:var(--field);color:var(--tx);
  font-weight:500;font-size:17px;line-height:1;font-family:inherit;padding:23px 54px 6px 18px;outline:0;caret-color:var(--p);-webkit-appearance:none;appearance:none;
  transition:background .25s,border-color .25s,box-shadow .25s}
.field input:focus{background:var(--fieldf);border-color:rgba(124,92,255,.75);box-shadow:0 0 0 4px rgba(124,92,255,.22)}
.field label{position:absolute;left:19px;top:20px;font-size:17px;color:var(--mut);pointer-events:none;transform-origin:left top;
  transition:transform .28s var(--ease)}
.field input:focus+label,.field input:not(:placeholder-shown)+label,.field input:-webkit-autofill+label{transform:translateY(-12px) scale(.72)}
.field input:-webkit-autofill{-webkit-text-fill-color:var(--tx);transition:background-color 99999s}
.eye{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:15px;background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.eye svg{width:22px;height:22px}
.eye .off{display:none}.eye.on .off{display:block}.eye.on .see{display:none}
.row{display:flex;align-items:center;justify-content:space-between;margin:16px 6px 2px;font-size:16px}
.sw{position:relative;width:51px;height:31px;border:0;padding:0;border-radius:99px;background:rgba(120,120,140,.38);cursor:pointer;transition:background .3s}
.sw i{position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:99px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.28);transition:left .3s var(--spring),width .2s}
.sw[aria-checked=true]{background:linear-gradient(120deg,var(--v),var(--p))}
.sw[aria-checked=true] i{left:22px}
.sw:active i{width:34px}.sw[aria-checked=true]:active i{left:15px}

.slide{--x:0px;--o:1;position:relative;height:64px;margin-top:18px;border-radius:32px;background:var(--field);border:1px solid var(--edge2);
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.18)}
.fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--x) + 62px);border-radius:32px;
  background:linear-gradient(120deg,var(--v),var(--p));transition:width .5s var(--spring),background .4s}
.lbl{position:absolute;inset:0;display:grid;place-items:center;padding-left:52px;font-weight:600;font-size:16px;letter-spacing:.01em;opacity:var(--o);
  background:linear-gradient(100deg,var(--mut) 32%,var(--tx) 50%,var(--mut) 68%) 0 0/230% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 2.8s linear infinite;transition:opacity .3s}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
.thumb{position:absolute;left:3px;top:3px;width:56px;height:56px;border:0;padding:0;border-radius:50%;background:#fff;color:#7c5cff;
  display:grid;place-items:center;cursor:grab;touch-action:none;outline:0;
  translate:var(--x) 0;scale:var(--s,1);
  box-shadow:0 8px 20px rgba(30,0,90,.4),inset 0 -3px 6px rgba(124,92,255,.2),inset 0 2px 2px #fff;
  transition:translate .5s var(--spring),scale .25s var(--ease)}
.thumb:focus-visible{box-shadow:0 0 0 4px rgba(255,255,255,.55),0 8px 20px rgba(30,0,90,.4)}
.thumb svg{width:26px;height:26px;grid-area:1/1}
.thumb .spin,.thumb .chk{display:none}
.slide.drag .thumb{cursor:grabbing;--s:1.08;transition:translate 0s,scale .25s var(--ease)}
.slide.drag .fill{transition:none}
.slide.armed .thumb{--s:1.14}
.slide.load .thumb .arr,.slide.ok .thumb .arr{display:none}
.slide.load .thumb .spin{display:block;animation:rot .8s linear infinite}
.slide.ok .thumb .chk{display:block}
.slide.ok .fill{background:linear-gradient(120deg,#10b981,var(--ok))}
.slide.ok .thumb{color:#059669}
@keyframes rot{to{rotate:360deg}}
.msg{min-height:22px;margin:12px 6px 0;font-size:14px;text-align:center;color:var(--bad)}
.msg.info{color:var(--mut)}
.alt{margin:8px 0 0;text-align:center;font-size:14px;color:var(--mut)}
.alt a,.alt button{color:var(--tx);font-weight:600;font-size:14px;line-height:1;font-family:inherit;text-decoration:none;background:none;border:0;padding:4px;cursor:pointer;border-bottom:1px solid var(--edge2)}
.alt .sep{margin:0 8px;opacity:.5}
.hd,.pn{min-width:0}
@media (min-width:600px) and (max-aspect-ratio:1/1){.card{width:480px;padding:44px 36px 32px}.app{width:104px;height:104px;border-radius:25px}h1{font-size:34px}}
@media (min-width:720px) and (min-aspect-ratio:1/1){
  .card{width:min(880px,100%);display:grid;grid-template-columns:1fr 1.05fr;gap:8px 36px;align-items:center;padding:40px 38px}
  .app{width:128px;height:128px;border-radius:30px}h1{font-size:38px}.sub{font-size:17px}form{margin-top:0}}
@media (min-width:1280px) and (min-aspect-ratio:1/1){.card{width:min(980px,100%);padding:48px 52px;gap:8px 56px}}
@media (max-height:600px){.app{width:60px;height:60px;border-radius:15px}h1{font-size:24px;margin-top:10px}.card{padding:18px 20px 14px}.field{margin-top:8px}.row{margin-top:10px}.slide{margin-top:12px}}
@media (max-height:600px) and (min-width:720px){.card{padding:20px 28px}.app{width:76px;height:76px}}
@media (pointer:coarse){.eye{width:48px;height:48px;top:6px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--p);outline-offset:3px}
.card:has(.alt)>footer{margin-top:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="card" id="card">
<div class="hd">
  <img class="app" src="icon-192.png" width="92" height="92" alt="TalcoITN-3">
  <h1>TalcoITN-3</h1>
  <p class="sub">Talco-IT-Networks</p>

</div>
<div class="pn">
  <form id="f" novalidate>
    <div class="field">
      <input id="u" name="username" type="text" placeholder=" " autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" inputmode="email">
      <label for="u">Identifiant ou e-mail</label>
    </div>
    <div class="field">
      <input id="p" name="password" type="password" placeholder=" " autocomplete="current-password" enterkeyhint="go">
      <label for="p">Mot de passe</label>
      <button class="eye" id="eye" type="button" aria-label="Afficher le mot de passe">
        <svg class="see" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.4 0-10-7-10-7a17.6 17.6 0 0 1 4.1-5M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>

    <div class="row"><span id="stayL">Rester connecté</span><button class="sw" id="stay" type="button" role="switch" aria-checked="true" aria-labelledby="stayL"><i></i></button></div>

    <div class="slide" id="slide">
      <div class="fill"></div>
      <span class="lbl" id="lbl">Glisser pour se connecter</span>
      <button class="thumb" id="thumb" type="button" aria-label="Se connecter : glisse vers la droite ou appuie sur Entrée">
        <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6"/><path d="M12 6l6 6-6 6" opacity=".45"/></svg>
        <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9" /></svg>
        <svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
    <p class="msg" id="msg" role="alert" aria-live="polite"></p>
    <button class="sr" type="submit" tabindex="-1">Se connecter</button>
  </form>

  <p class="alt"><button id="install" type="button" hidden>Installer l’appli</button></p>
  <noscript><p class="msg">JavaScript est nécessaire pour se connecter.</p></noscript>
</div>
</main>



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var BASE="https://natlacaxi.github.io/";   // services : BASE + nom en minuscules + "/"
var KEY="talco_session";
var HOME="index.html";
var CONFIGS=[
{apiKey:"AIzaSyDSlrxGsR6SyAlTDkTecOo_WZQafIrCRzI",authDomain:"itn-1-b2660.firebaseapp.com",databaseURL:"https://itn-1-b2660-default-rtdb.europe-west1.firebasedatabase.app",projectId:"itn-1-b2660",appId:"1:1014813288647:web:1dd6fac88435d63650b6e2"},
{apiKey:"AIzaSyABc0-3-D4kTgnH4-He_yEO8km45ah0BqY",authDomain:"itn-2-fa6a9.firebaseapp.com",databaseURL:"https://itn-2-fa6a9-default-rtdb.europe-west1.firebasedatabase.app",projectId:"itn-2-fa6a9",appId:"1:599829214627:web:a82b6c70638db8ddda1616"},
{apiKey:"AIzaSyALu9n3ksX-0mN4u8reRBpFkWAUsVsGswA",authDomain:"itn-3-1b09f.firebaseapp.com",databaseURL:"https://itn-3-1b09f-default-rtdb.europe-west1.firebasedatabase.app",projectId:"itn-3-1b09f",appId:"1:105336373207:web:238065cbea49453d4d1592"},
{apiKey:"AIzaSyBnD2qS2TLKvFRFTi5HxWMIo4CPXaQ3FVM",authDomain:"itn-4-4a63e.firebaseapp.com",databaseURL:"https://itn-4-4a63e-default-rtdb.europe-west1.firebasedatabase.app",projectId:"itn-4-4a63e",appId:"1:764157056750:web:38fdbe924f9518273ec5ff"},
{apiKey:"AIzaSyDjGRuEWDzbxuzFEdcdG465TRdV5KXRcAA",authDomain:"itn-5-fd577.firebaseapp.com",databaseURL:"https://itn-5-fd577-default-rtdb.europe-west1.firebasedatabase.app",projectId:"itn-5-fd577",appId:"1:644450805208:web:0451fbbe95848ec2417ead"}
];

/* ---------- destination après connexion ---------- */
var q=new URLSearchParams(location.search);
var to=(q.get("to")||"").replace(/[^A-Za-z0-9]/g,"").slice(0,40);
var DEST=to?HOME+"?open="+to:HOME;   // retour au portail, qui ouvre directement le service demandé

/* ---------- Firebase : mêmes noms d’apps (p0..p4) que le portail ---------- */
var auths=[];
try{
  auths=CONFIGS.map(function(c,i){
    var a=firebase.apps.filter(function(x){return x.name==="p"+i})[0]||firebase.initializeApp(c,"p"+i);
    return a.auth();
  });
}catch(e){}

var card=$("#card"),slide=$("#slide"),thumb=$("#thumb"),lbl=$("#lbl"),msgEl=$("#msg");
var u=$("#u"),p=$("#p"),stayB=$("#stay");
var busy=false,max=0,x=0,drag=false,sx=0,armed=false,stay=true;

function msg(t,info){msgEl.textContent=t||"";msgEl.className="msg"+(info?" info":"")}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function measure(){max=Math.max(0,slide.clientWidth-62-1)}
function set(v,anim){
  x=Math.max(0,Math.min(max,v));
  slide.style.setProperty("--x",x+"px");
  slide.style.setProperty("--o",String(Math.max(0,1-x/(max*.5||1))));
}
measure();

/* ---------- curseur (slider) : suit le doigt, coins arrondis, rebond ---------- */
thumb.addEventListener("pointerdown",function(e){
  if(busy)return;
  measure();drag=true;sx=e.clientX-x;
  try{thumb.setPointerCapture(e.pointerId)}catch(_){}
  slide.classList.add("drag");
});
thumb.addEventListener("pointermove",function(e){
  if(!drag)return;
  set(e.clientX-sx);
  var on=x/max>=.88;
  if(on&&!armed){armed=true;vib(14);slide.classList.add("armed")}
  if(!on&&armed){armed=false;slide.classList.remove("armed")}
});
function release(){
  if(!drag)return;
  drag=false;slide.classList.remove("drag","armed");
  if(x/max>=.88){set(max);submit()}else{set(0)}
  armed=false;
}
thumb.addEventListener("pointerup",release);
thumb.addEventListener("pointercancel",release);
thumb.addEventListener("lostpointercapture",release);
thumb.addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){e.preventDefault();if(!busy){measure();set(max);submit()}}
});
addEventListener("resize",function(){measure();if(!busy&&!drag)set(0)});

/* ---------- formulaire ---------- */
$("#f").addEventListener("submit",function(e){e.preventDefault();if(!busy){measure();set(max);submit()}});
u.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();p.focus()}});
$("#eye").addEventListener("click",function(){
  var on=p.type==="password";p.type=on?"text":"password";this.classList.toggle("on",on);
  this.setAttribute("aria-label",on?"Masquer le mot de passe":"Afficher le mot de passe");
});
stayB.addEventListener("click",function(){
  stay=!stay;stayB.setAttribute("aria-checked",String(stay));vib(8);
});

var ERR={
  "auth/too-many-requests":"Trop de tentatives. Réessaie dans quelques minutes.",
  "auth/network-request-failed":"Pas de connexion au serveur. Vérifie ton réseau.",
  "auth/user-disabled":"Ce compte est désactivé."
};
function mail(n){return n.trim().toLowerCase().replace(/[^a-z0-9_.]/g,"")+"@talcoexchange.app"}

function fail(t){
  busy=false;slide.classList.remove("load","ok");lbl.textContent="Glisser pour se connecter";
  set(0);msg(t);vib([20,40,20]);
  card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
}
function success(email){
  busy=true;slide.classList.remove("load");slide.classList.add("ok");lbl.textContent="Connecté";
  set(max);msg("");vib(18);
  try{
    var old=JSON.parse(localStorage.getItem(KEY)||"null")||{};
    localStorage.setItem(KEY,JSON.stringify({email:email||old.email||"",prenom:old.prenom||"",nom:old.nom||"",id:old.id||"",t:Date.now()}));
  }catch(e){}
  setTimeout(function(){location.replace(DEST)},700);
}

async function signIn(v,pw){
  var email=v.indexOf("@")>-1?v.trim():mail(v);
  var persist=stay?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION;
  var last=null;
  for(var i=0;i<auths.length;i++){
    try{
      await auths[i].setPersistence(persist);
      var c=await auths[i].signInWithEmailAndPassword(email,pw);
      return {u:c.user,email:email};
    }catch(e){
      last=e;var code=e&&e.code||"";
      if(ERR[code])throw e;      // erreur bloquante : inutile d’essayer les autres projets
    }
  }
  throw last||new Error("x");
}

async function submit(){
  if(busy)return;
  var v=u.value.trim(),pw=p.value;
  if(!v||!pw){fail("Renseigne ton identifiant et ton mot de passe.");(v?p:u).focus();return}
  if(!auths.length){fail("Impossible de charger la connexion. Vérifie ton réseau puis recharge la page.");return}
  busy=true;slide.classList.add("load");lbl.textContent="Connexion…";msg("");
  try{
    var r=await signIn(v,pw);
    success(r.email);
  }catch(e){
    fail(ERR[e&&e.code]||"Identifiant ou mot de passe incorrect.");
  }
}

/* ---------- déjà connecté sur cet appareil : on passe directement ---------- */
function existing(){
  return new Promise(function(res){
    var n=0,done=false;
    function end(v){if(!done){done=true;res(v)}}
    if(!auths.length)return end(null);
    auths.forEach(function(a){a.onAuthStateChanged(function(user){n++;if(user)end(user);else if(n===auths.length)end(null)})});
    setTimeout(function(){end(null)},4000);
  });
}
existing().then(function(user){if(user&&!q.has("relog")){measure();success(user.email||"")}});


/* ---------- installer l’appli ---------- */
var inst=$("#install"),dp=null;
var standalone=(matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;if(!standalone)inst.hidden=false});
if(!standalone&&ios)inst.hidden=false;
inst.addEventListener("click",async function(){
  if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null;inst.hidden=true}
  else msg("Sur iPhone : touche « Partager », puis « Sur l’écran d’accueil ».",true);
});
addEventListener("appinstalled",function(){inst.hidden=true});

if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
</html>
