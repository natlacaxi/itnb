<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connexion | TalcoITN-3</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/svg+xml" href="light/icon.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="dark/icon.svg" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#7c5cff">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="msapplication-config" content="browserconfig.xml">
  <meta name="msapplication-TileColor" content="#7c5cff">
  <meta name="msapplication-TileImage" content="mstile-150x150.png">
  <meta name="theme-color" content="#070a12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7ff" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card: #0c1220;
      --line: rgba(255, 255, 255, .1);
      --tx: #eef2fa;
      --mut: #8593ab;
      --cy: #22d3ee;
      --vi: #8b5cf6;
      --ok: #34d399;
      --bad: #f87171
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--tx);
      font: 500 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
      display: flex;
      flex-direction: column
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(60vmax 40vmax at 85% -10%, rgba(139, 92, 246, .22), transparent 60%), radial-gradient(50vmax 40vmax at -10% 110%, rgba(34, 211, 238, .13), transparent 60%)
    }

    #prov {
      background: rgba(245, 158, 11, .14);
      border-bottom: 1px solid rgba(245, 158, 11, .35);
      color: #fbbf24;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      padding: 7px 14px
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px 16px
    }

    .card {
      width: min(460px, 100%);
      background: rgba(12, 18, 32, .85);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 26px 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -.01em;
      margin-bottom: 4px
    }

    .brand i {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: url(favicon-96.png) center/cover no-repeat, linear-gradient(145deg, #7c5cff, #ff5fa8);
      box-shadow: 0 4px 12px rgba(124, 92, 255, .45)
    }

    .sub {
      color: var(--mut);
      margin: 0 0 18px;
      font-size: 14px
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 18px
    }

    .tabs button {
      border: 0;
      background: none;
      color: var(--mut);
      font: 700 14px "Plus Jakarta Sans", sans-serif;
      padding: 9px;
      border-radius: 10px;
      cursor: pointer
    }

    .tabs button.on {
      background: linear-gradient(135deg, var(--cy), var(--vi));
      color: #06090e
    }

    form {
      display: none;
      gap: 12px
    }

    form.on {
      display: grid
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
      font-size: 13px
    }

    input {
      width: 100%;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--tx);
      font: 500 15px "Plus Jakarta Sans", sans-serif;
      outline: 0;
      transition: border-color .2s, box-shadow .2s
    }

    input:focus {
      border-color: var(--cy);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, .15)
    }

    .go {
      margin-top: 4px;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(135deg, var(--cy), var(--vi));
      color: #06090e;
      font: 800 15px "Plus Jakarta Sans", sans-serif;
      cursor: pointer
    }

    .go:disabled {
      opacity: .55;
      cursor: wait
    }

    .lnk {
      background: none;
      border: 0;
      color: var(--cy);
      font: 600 13px "Plus Jakarta Sans", sans-serif;
      cursor: pointer;
      padding: 0;
      justify-self: start
    }

    #msg {
      display: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 14px
    }

    #msg.bad {
      background: rgba(248, 113, 113, .1);
      border: 1px solid rgba(248, 113, 113, .35);
      color: var(--bad)
    }

    #msg.ok {
      background: rgba(52, 211, 153, .1);
      border: 1px solid rgba(52, 211, 153, .35);
      color: var(--ok)
    }

    #resend {
      display: none;
      margin: -6px 0 14px
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--mut);
      font-size: 13px;
      text-decoration: none
    }

    .hint {
      color: var(--mut);
      font-size: 12px;
      font-weight: 500
    }

    :focus-visible {
      outline: 2px solid var(--cy);
      outline-offset: 2px
    }

    @media(max-width:480px) {
      .two {
        grid-template-columns: 1fr
      }

      .card {
        padding: 22px 18px
      }
    }
  </style>
</head>

<body>
  <div id="prov">⚠ Service provisoire — certains services ne fonctionneront pas.</div>
  <main>
    <div class="card">
      <div class="brand"><i></i>TalcoITN-3</div>
      <p class="sub">Connectez-vous pour accéder aux services.</p>

      <div class="tabs" role="tablist">
        <button type="button" class="on" data-t="in" role="tab">Se connecter</button>
        <button type="button" data-t="up" role="tab">Créer un compte</button>
      </div>

      <div id="msg" role="alert"></div>
      <button type="button" class="lnk" id="resend">Renvoyer le mail de validation</button>

      <!-- Connexion -->
      <form id="fin" class="on" autocomplete="on" novalidate>
        <label>Pseudo<input id="lid" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label>Mot de passe<input id="lpw" type="password" autocomplete="current-password" required></label>
        <button class="go" type="submit">Se connecter</button>
        <button type="button" class="lnk" id="forgot">Mot de passe oublié ?</button>
      </form>

      <!-- Inscription -->
      <form id="fup" autocomplete="on" novalidate>
        <label>Code d’invitation<input id="sinv" inputmode="numeric" autocomplete="off" required></label>
        <div class="two">
          <label>Prénom<input id="spre" autocomplete="given-name" required></label>
          <label>Nom<input id="snom" autocomplete="family-name" required></label>
        </div>
        <label>Pseudo<input id="sps" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          <span class="hint">3 à 20 caractères : lettres, chiffres, _ ou -</span></label>
        <label>Téléphone<input id="stel" type="tel" autocomplete="tel" required></label>
        <label>E-mail<input id="smail" type="email" autocomplete="email" required></label>
        <div class="two">
          <label>Mot de passe<input id="sp1" type="password" autocomplete="new-password" required></label>
          <label>Confirmer<input id="sp2" type="password" autocomplete="new-password" required></label>
        </div>
        <span class="hint">8 caractères minimum. Un mail de validation vous sera envoyé : vous devrez cliquer sur le lien
          avant de pouvoir vous connecter.</span>
        <button class="go" type="submit">Créer mon compte</button>
      </form>

      <a class="back" href="index.html">← Retour au portail</a>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const CFG = {
      apiKey: "AIzaSyABc0-3-D4kTgnH4-He_yEO8km45ah0BqY",
      authDomain: "itn-2-fa6a9.firebaseapp.com",
      databaseURL: "https://itn-2-fa6a9-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "itn-2-fa6a9",
      storageBucket: "itn-2-fa6a9.firebasestorage.app",
      messagingSenderId: "599829214627",
      appId: "1:599829214627:web:a82b6c70638db8ddda1616"
    };
    /* Nom d’app « p1 » = même session que le portail et les services */
    const app = firebase.initializeApp(CFG, "p1"), auth = app.auth(), db = app.database();
    const $ = s => document.querySelector(s);

    let to = (new URLSearchParams(location.search).get("to") || "").replace(/^Talco/, "");
    if (!/^[A-Za-zÀ-ÿ]{2,40}$/.test(to)) to = "";
    const dest = () => "index.html" + (to ? "?open=" + encodeURIComponent(to) : "");

    const PSEUDO = /^[a-z0-9_-]{3,20}$/, TEL = /^\+?[0-9 .-]{6,20}$/, MAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const msg = (t, ok) => { const m = $("#msg"); m.textContent = t || ""; m.className = ok ? "ok" : "bad"; m.style.display = t ? "block" : "none" };
    const busy = (f, b) => f.querySelectorAll("button").forEach(x => x.disabled = b);
    const authErr = e => ({
      "auth/invalid-credential": "Identifiants incorrects.", "auth/wrong-password": "Identifiants incorrects.",
      "auth/user-not-found": "Identifiants incorrects.", "auth/invalid-email": "Adresse e-mail invalide.",
      "auth/email-already-in-use": "Cette adresse e-mail est déjà utilisée.", "auth/weak-password": "Mot de passe trop faible.",
      "auth/too-many-requests": "Trop de tentatives. Réessayez dans quelques minutes.",
      "auth/network-request-failed": "Problème de réseau. Vérifiez votre connexion."
    })[e && e.code] || "Une erreur est survenue. Réessayez.";

    /* Onglets */
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
      $("#fin").classList.toggle("on", b.dataset.t === "in");
      $("#fup").classList.toggle("on", b.dataset.t === "up");
      msg(""); $("#resend").style.display = "none";
    });

    /* ===== Connexion (pseudo ou e-mail) ===== */
    let pending = null;
    $("#fin").onsubmit = async e => {
      e.preventDefault(); msg(""); $("#resend").style.display = "none";
      const id = $("#lid").value.trim().toLowerCase(), pw = $("#lpw").value;
      if (!id || !pw) return msg("Renseignez votre pseudo et votre mot de passe.");
      busy(e.target, true);
      try {
        let email = id;
        if (!id.includes("@")) {
          if (!PSEUDO.test(id)) throw { code: "auth/invalid-credential" };
          const s = await db.ref("pseudos/" + id).get();
          if (!s.exists() || !s.val().email) throw { code: "auth/invalid-credential" };
          email = s.val().email;
        }
        const cred = await auth.signInWithEmailAndPassword(email, pw), u = cred.user;
        if (!u.emailVerified) {
          pending = u;
          $("#resend").style.display = "block";
          return msg("Adresse e-mail non validée. Cliquez sur le lien reçu par mail, puis reconnectez-vous.");
        }
        const p = await db.ref("users/" + u.uid).get();
        if (!p.exists()) { await auth.signOut(); return msg("Compte incomplet. Recréez votre compte avec un code d’invitation valide.") }
        msg("Connexion réussie…", true);
        location.replace(dest());
      } catch (er) { msg(authErr(er)) }
      finally { busy(e.target, false) }
    };
    $("#resend").onclick = async () => {
      if (!pending) return;
      try { await pending.sendEmailVerification(); msg("Mail de validation renvoyé. Pensez à vérifier vos spams.", true) }
      catch (er) { msg(authErr(er)) }
      $("#resend").style.display = "none"; try { await auth.signOut() } catch (x) { } pending = null;
    };
    $("#forgot").onclick = async () => {
      msg("");
      let id = $("#lid").value.trim().toLowerCase();
      if (!id) return msg("Saisissez votre pseudo ou votre e-mail ci-dessus.");
      try {
        let email = id;
        if (!id.includes("@")) {
          const s = PSEUDO.test(id) ? await db.ref("pseudos/" + id).get() : null;
          if (s && s.exists()) email = s.val().email; else return msg("Si le compte existe, un mail de réinitialisation a été envoyé.", true);
        }
        await auth.sendPasswordResetEmail(email);
        msg("Si le compte existe, un mail de réinitialisation a été envoyé.", true);
      } catch (er) { msg(authErr(er)) }
    };

    /* ===== Inscription ===== */
    $("#fup").onsubmit = async e => {
      e.preventDefault(); msg("");
      const code = $("#sinv").value.trim(), prenom = $("#spre").value.trim(), nom = $("#snom").value.trim(),
        pseudo = $("#sps").value.trim().toLowerCase(), tel = $("#stel").value.trim(),
        email = $("#smail").value.trim().toLowerCase(), p1 = $("#sp1").value, p2 = $("#sp2").value;
      if (!code) return msg("Le code d’invitation est obligatoire.");
      if (!prenom || !nom) return msg("Prénom et nom obligatoires.");
      if (!PSEUDO.test(pseudo)) return msg("Pseudo invalide (3 à 20 caractères : a-z, 0-9, _ ou -).");
      if (!TEL.test(tel)) return msg("Numéro de téléphone invalide.");
      if (!MAIL.test(email)) return msg("Adresse e-mail invalide.");
      if (p1.length < 8) return msg("Le mot de passe doit contenir au moins 8 caractères.");
      if (p1 !== p2) return msg("Les deux mots de passe ne correspondent pas.");
      busy(e.target, true);
      let u = null;
      try {
        const taken = await db.ref("pseudos/" + pseudo).get();
        if (taken.exists()) return msg("Ce pseudo est déjà pris.");
        u = (await auth.createUserWithEmailAndPassword(email, p1)).user;
        /* Écriture atomique : profil + pseudo. Le code d’invitation est vérifié par les règles du serveur. */
        const upd = {};
        upd["users/" + u.uid] = { prenom, nom, tel, email, pseudo, invite: code, createdAt: firebase.database.ServerValue.TIMESTAMP };
        upd["pseudos/" + pseudo] = { uid: u.uid, email };
        try { await db.ref().update(upd) }
        catch (er) {
          await u.delete().catch(() => { }); u = null;
          return msg("Code d’invitation invalide (ou pseudo déjà pris).");
        }
        await u.sendEmailVerification();
        await auth.signOut(); u = null;
        e.target.reset();
        document.querySelector('.tabs button[data-t="in"]').click();
        msg("Compte créé ! Un mail de validation vient d’être envoyé à " + email + ". Cliquez sur le lien, puis connectez-vous.", true);
      } catch (er) {
        if (u) { await u.delete().catch(() => { }) }
        msg(authErr(er));
      } finally { busy(e.target, false) }
    };
  </script>
</body>

</html>
